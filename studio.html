<script>
const SUPABASE_URL = 'https://hbapzwxdehfgnputrfjf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_DqQ2QLBEd_mRzWIRH5npXA_e99yfAzY';

const params = new URLSearchParams(location.search);
// s = Studio-Slug, optional mit angehaengtem Standort-Slug (z. B.
// "john-harris-salzburg"). Alternativ ?s=<studio>&standort=<standort>.
const sParam = (params.get('s') || '').trim();
const vorschauSchluessel = params.get('vorschau') || '';
let standortWahl = params.get('standort') || '';

let sess = null;
try { sess = JSON.parse(localStorage.getItem('vexfit_session') || 'null'); } catch(e) {}
const angemeldet = !!(sess && sess.access_token);

async function studioLaden(slug){
  const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/studio_anzeigen', {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_slug: slug, p_vorschau: vorschauSchluessel })
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return await res.json();
}

// Loest den s-Parameter gegen die echten Daten auf (kein Raten des Slug-Schemas):
// zuerst s komplett als Studio-Slug, sonst von rechts her an jedem "-" trennen
// und den vorderen Teil als Studio, den hinteren als Standort versuchen.
async function aufloesen(s){
  if(!s) return { studio: null, standort: '' };
  let studio = await studioLaden(s).catch(() => null);
  if(studio) return { studio, standort: standortWahl };
  const teile = s.split('-');
  for(let k = teile.length - 1; k >= 1; k--){
    const studioSlug = teile.slice(0, k).join('-');
    const standortSlug = teile.slice(k).join('-');
    studio = await studioLaden(studioSlug).catch(() => null);
    if(studio && (studio.standorte || []).some(st => st.slug === standortSlug)){
      return { studio, standort: standortSlug };
    }
  }
  return { studio: null, standort: '' };
}

function trainerKarten(trainer, slug, studioName){
  return trainer.map(t=>{
    const initialen = vexEsc(((t.vorname||'?')[0]+(t.nachname||'?')[0]).toUpperCase());
    const tags = (t.spezialisierungen||[]).slice(0,3).map(s=>`<span class="ctag">${vexEsc(s)}</span>`).join('');
    const knopf = angemeldet
      ? `<a href="profil.html?id=${encodeURIComponent(t.id)}" class="btn-anmelden">Profil &amp; Anfrage</a>`
      : `<a href="registrieren.html?typ=kunde&standort=${encodeURIComponent(slug)}" class="btn-anmelden">Anmelden und anfragen</a>`;
    return `<div class="tc">
      <div class="ci"><div class="cav">${initialen}</div>${t.verifiziert === true ? '<div class="cbadge">Verifiziert ✓</div>' : ''}</div>
      <div class="cb">
        <div class="cn">${vexEsc(t.vorname)} ${vexEsc(t.nachname)}</div>
        <div class="cl">${vexEsc(t.trainingsart||'Personal Training')}</div>
        <div class="cstudio">Trainer bei ${vexEsc(studioName)}</div>
        <div class="ctags">${tags}</div>
      </div>
      ${knopf}
    </div>`;
  }).join('');
}

function adresseHtml(a){
  const teile = [];
  if(a.adresse) teile.push(a.adresse.replace(/HIER EINFÜGEN/g,'<span class="platzhalter">folgt</span>'));
  const ort = [a.plz, a.stadt].filter(Boolean).join(' ').replace(/HIER EINFÜGEN/g,'<span class="platzhalter">folgt</span>');
  if(ort.trim()) teile.push(ort);
  return teile.join('<br>');
}

function standortBlock(a, studioName){
  const echte = a.trainer || [];
  const inhalt = echte.length
    ? `<div class="grid">${trainerKarten(echte, a.slug, studioName)}</div>`
    : `<div class="leer">Für diesen Standort sind bald Trainer verfügbar. <a href="registrieren.html?typ=kunde&standort=${encodeURIComponent(a.slug)}" style="color:var(--accent)">Jetzt vormerken →</a></div>`;
  return `<div class="standort" id="standort-${vexEsc(a.slug)}">
    <div class="standort-kopf">
      <div class="standort-name">${vexEsc(a.name)}</div>
      <div class="standort-adresse">${adresseHtml(a)}</div>
      <a class="standort-cta" href="registrieren.html?typ=kunde&standort=${encodeURIComponent(a.slug)}">Trainer anfragen</a>
    </div>
    ${inhalt}
  </div>`;
}

async function laden(){
  try {
    if(!sParam){
      document.getElementById('inhalt').innerHTML = '<div class="fehler">Kein Studio angegeben.</div>';
      return;
    }
    const { studio, standort } = await aufloesen(sParam);
    if(!studio){
      document.getElementById('inhalt').innerHTML =
        '<div class="fehler">Diese Seite ist noch nicht freigeschaltet.<br>Bitte wende dich an dein Studio.</div>';
      return;
    }
    document.getElementById('studioName').textContent = studio.name;
    if(studio.vorschau){
      const band = document.createElement('div');
      band.className = 'vorschau-band';
      band.textContent = '👁 Vorschau – diese Seite ist noch nicht öffentlich. Nur über den geheimen Link erreichbar.';
      document.body.prepend(band);
      document.body.classList.add('vorschau');
    }
    const alle = studio.standorte || [];
    // Nur den gewaehlten Standort anzeigen (keine anderen Trainer, keine
    // allgemeine Suche). Ohne Standort: alle Standorte des Studios.
    const zeigen = standort ? alle.filter(s => s.slug === standort) : alle;
    if(standort && zeigen[0]){
      document.getElementById('studioSub').textContent =
        'Deine Personal Trainer bei ' + studio.name + ' – Profile ansehen und direkt anfragen, kostenlos.';
      try {
        localStorage.setItem('vexfit_studio', JSON.stringify({
          standort_id: zeigen[0].id, slug: zeigen[0].slug, studio: studio.name, standort: zeigen[0].name
        }));
      } catch(e) {}
    }
    const html = zeigen.map(a => standortBlock(a, studio.name)).join('');
    document.getElementById('inhalt').innerHTML = html || '<div class="leer">Noch keine Standorte hinterlegt.</div>';
  } catch(e){
    console.error(e);
    document.getElementById('inhalt').innerHTML =
      '<div class="fehler">Die Seite konnte gerade nicht geladen werden. Bitte lade sie neu.</div>';
  }
}
laden();
</script>

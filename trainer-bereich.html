<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="vexfit-logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Vexfit – Trainer Bereich</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--white:#f5f5f0;--accent:#e8ff00;--gray:#141414;--mid:#1a1a1a;--card:#161616;--muted:#555;--border:rgba(255,255,255,0.07);--bi:rgba(255,255,255,0.1);--green:#4ade80;--orange:#fb923c}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--white);font-family:'DM Sans',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
nav{position:fixed;top:0;left:0;right:0;z-index:100;height:56px;background:rgba(10,10,10,0.98);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:4px;color:var(--white);text-decoration:none}
.logo span{color:var(--accent)}
.nav-right{display:flex;align-items:center;gap:12px}
.nav-profile{display:flex;align-items:center;gap:8px;background:var(--mid);border:1px solid var(--border);padding:7px 14px;border-radius:100px;font-size:12px;color:var(--white);cursor:pointer;text-decoration:none;transition:border-color 0.2s}
.nav-profile:hover{border-color:rgba(232,255,0,0.3)}
.nav-profile-dot{width:8px;height:8px;background:var(--accent);border-radius:50%;flex-shrink:0}
.nav-badge{background:var(--accent);color:var(--bg);font-size:10px;font-weight:700;width:18px;height:18px;border-radius:50%;display:none;align-items:center;justify-content:center}
.btn-logout{background:none;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:3px;font-family:'DM Sans',sans-serif;font-size:11px;cursor:pointer}
.btn-logout:hover{color:var(--white)}
/* WELCOME PAGE */
.page{padding:100px 20px 60px;max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center}
.icon-wrap{width:80px;height:80px;border-radius:50%;background:rgba(232,255,0,0.08);border:2px solid rgba(232,255,0,0.2);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 28px;animation:popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both}
.title{font-family:'Bebas Neue',sans-serif;font-size:clamp(32px,8vw,52px);line-height:0.9;letter-spacing:2px;margin-bottom:16px;animation:fadeUp 0.5s 0.2s ease both;opacity:0}
.title span{color:var(--accent)}
.desc{font-size:15px;color:var(--muted);line-height:1.8;font-weight:300;margin-bottom:28px;animation:fadeUp 0.5s 0.3s ease both;opacity:0}
.tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:32px;animation:fadeUp 0.5s 0.4s ease both;opacity:0}
.tag{padding:6px 14px;border:1px solid rgba(232,255,0,0.2);border-radius:100px;font-size:11px;color:var(--accent);font-weight:600;letter-spacing:1px;text-transform:uppercase}
.tag-gray{border-color:var(--border);color:var(--muted)}
.btn-primary{background:var(--accent);color:var(--bg);padding:14px 32px;border-radius:3px;font-weight:700;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;text-decoration:none;display:inline-block;animation:fadeUp 0.5s 0.5s ease both;opacity:0;cursor:pointer;border:none;font-family:'DM Sans',sans-serif}
.email-note{font-size:12px;color:rgba(85,85,85,0.7);margin-top:16px;animation:fadeUp 0.5s 0.6s ease both;opacity:0}
/* ANFRAGEN PAGE */
.anfragen-page{padding:80px 20px 60px;max-width:640px;margin:0 auto}
.ap-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1.5px;margin-bottom:4px}
.ap-sub{font-size:13px;color:var(--muted);margin-bottom:24px}
.anfrage-card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:18px;margin-bottom:10px}
.anf-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.anf-name{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px}
.anf-date{font-size:11px;color:var(--muted)}
.anf-ziel{font-size:13px;color:var(--muted);margin-bottom:10px}
.contact-box{background:rgba(74,222,128,0.06);border:1px solid rgba(74,222,128,0.2);border-radius:4px;padding:14px;font-size:13px;line-height:1.8}
.contact-box a{color:var(--accent)}
.locked-box{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:4px;padding:14px}
.btn-stripe{display:inline-block;background:var(--accent);color:var(--bg);padding:10px 18px;border-radius:3px;font-weight:700;font-size:11px;letter-spacing:1px;text-transform:uppercase;text-decoration:none;margin-top:8px}
.msg-box{font-size:13px;color:var(--muted);font-style:italic;padding:10px;background:rgba(255,255,255,0.02);border-radius:3px;border-left:2px solid var(--border);margin-top:8px}
.empty-state{text-align:center;padding:48px 20px;color:var(--muted)}
.status-bar{background:rgba(251,146,60,0.08);border:1px solid rgba(251,146,60,0.2);border-radius:4px;padding:14px 18px;margin-bottom:20px;font-size:13px;color:var(--orange);line-height:1.7}
.status-bar.aktiv{background:rgba(74,222,128,0.06);border-color:rgba(74,222,128,0.2);color:var(--green)}
.hidden{display:none}
@keyframes popIn{from{opacity:0;transform:scale(0.4)}to{opacity:1;transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes waBounce{0%{opacity:0;transform:scale(0.5)}100%{opacity:1;transform:scale(1)}}
.wa{position:fixed;bottom:20px;right:16px;z-index:9999;width:46px;height:46px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 16px rgba(37,211,102,0.4);opacity:0;animation:waBounce 0.5s 2s ease both;text-decoration:none}
@media(min-width:640px){nav{padding:0 32px}}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">VEX<span>FIT</span></a>
  <div class="nav-right">
    <a href="#" class="nav-profile" id="navProfileBtn" onclick="toggleAnfragen(event)">
      <div class="nav-profile-dot"></div>
      <span>Meine Anfragen</span>
      <div class="nav-badge" id="navBadge">0</div>
    </a>
    <button class="btn-logout" onclick="logout()">Ausloggen</button>
  </div>
</nav>

<!-- WILLKOMMENS-SEITE -->
<div class="page" id="welcomePage">
  <div class="icon-wrap">💪</div>
  <div class="title">DU BIST<br><span>REGISTRIERT!</span></div>
  <p class="desc">Wir benachrichtigen dich sobald ein Kunde Interesse an dir findet.<br>Vervollständige dein Profil für mehr Anfragen.</p>
  <div class="tags" id="statusTags">
    <span class="tag">✓ Profil gespeichert</span>
    <span class="tag tag-gray" id="statusTag">⏳ Wird geprüft</span>
  </div>
  <button class="btn-primary" onclick="toggleAnfragen(event)">Meine Anfragen ansehen →</button>
  <p class="email-note" id="emailNote">Eingeloggt als: –</p>
</div>

<!-- ANFRAGEN PAGE -->
<div class="anfragen-page hidden" id="anfragenPage">
  <div class="ap-title">MEINE ANFRAGEN</div>
  <p class="ap-sub">Kunden die dich kontaktiert haben</p>
  <div id="statusBarEl"></div>
  <div id="anList"><div class="empty-state">Wird geladen...</div></div>
</div>

<a href="https://wa.me/436649275737" target="_blank" class="wa">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
</a>

<script>
const SB = 'https://hbapzwxdehfgnputrfjf.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhiYXB6d3hkZWhmZ25wdXRyZmpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDc0NzQsImV4cCI6MjA5NDQyMzQ3NH0.vIQLcTObF5tmBEuxKL2EEUd4U88k0mdTmsAafG8djN4';
const STRIPE = 'https://buy.stripe.com/eVqdR9gopdNhczNbhw2oE00';
let T = null;

// AUTH - no redirect loop
const raw = localStorage.getItem('vexfit_session');
if(!raw) { location.href = 'login.html'; throw new Error(); }
let sess;
try { sess = JSON.parse(raw); } catch(e) { localStorage.removeItem('vexfit_session'); location.href = 'login.html'; throw new Error(); }
if(sess.role === 'kunde') { location.href = 'kunden-bereich.html'; throw new Error(); }

document.getElementById('emailNote').textContent = 'Eingeloggt als: ' + sess.email;
loadTrainer(sess.email);

async function loadTrainer(email) {
  try {
    const r = await fetch(`${SB}/rest/v1/trainers?email=eq.${encodeURIComponent(email)}&select=*`, {
      headers: { apikey: KEY, Authorization: `Bearer ${KEY}` }
    });
    const d = await r.json();
    if(d && d.length > 0) {
      T = d[0];
      // Update status tag
      const stag = document.getElementById('statusTag');
      if(T.aktiv) { stag.textContent = '✓ Profil aktiv'; stag.classList.remove('tag-gray'); }
      else { stag.textContent = '⏳ Wird geprüft'; }
    }
    loadAnfragen(email);
  } catch(e) {}
}

async function loadAnfragen(email) {
  try {
    const r = await fetch(`${SB}/rest/v1/anfragen?trainer_email=eq.${encodeURIComponent(email)}&order=created_at.desc`, {
      headers: { apikey: KEY, Authorization: `Bearer ${KEY}` }
    });
    const data = await r.json() || [];
    if(data.length > 0) {
      const badge = document.getElementById('navBadge');
      badge.textContent = data.length;
      badge.style.display = 'flex';
    }
    renderAnfragen(data);
  } catch(e) {}
}

function renderAnfragen(data) {
  const el = document.getElementById('anList');
  // Status bar
  const sb = document.getElementById('statusBarEl');
  if(T) {
    if(!T.aktiv) {
      sb.innerHTML = '<div class="status-bar">⏳ Dein Profil wird noch geprüft. Wir melden uns per E-Mail sobald du aktiviert wirst.</div>';
    } else if(!T.stripe_bezahlt) {
      sb.innerHTML = '<div class="status-bar aktiv">✓ Profil aktiv · Kostenlose Phase — sobald du deinen ersten Kunden gewinnst schicken wir dir den Zahlungslink.</div>';
    } else {
      sb.innerHTML = '<div class="status-bar aktiv">✅ Profil aktiv · Abo läuft</div>';
    }
  }
  if(!data.length) {
    el.innerHTML = '<div class="empty-state">📭<br><br>Noch keine Anfragen.<br>Sobald ein Kunde dich kontaktiert erscheint es hier.</div>';
    return;
  }
  el.innerHTML = data.map(a => {
    const date = new Date(a.created_at).toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit',year:'numeric'});
    let contactHTML = '';
    if(T && T.stripe_bezahlt && a.weitergeleitet) {
      contactHTML = `<div class="contact-box"><strong style="font-size:11px;color:var(--green);letter-spacing:1px;text-transform:uppercase">✅ Kontaktdaten freigegeben</strong><br>👤 ${a.kunden_name||'–'}<br>📧 <a href="mailto:${a.kunden_email}">${a.kunden_email||'–'}</a></div>`;
    } else if(T && !T.stripe_bezahlt) {
      contactHTML = `<div class="locked-box"><div style="font-size:12px;color:var(--muted);margin-bottom:8px">🔒 Abo aktivieren um Kontaktdaten zu sehen</div><a href="${STRIPE}" target="_blank" class="btn-stripe">Für €49,99/Mo freischalten →</a></div>`;
    } else {
      contactHTML = '<div style="font-size:12px;color:var(--muted);margin-top:8px">⏳ Wird von Vexfit freigeschaltet...</div>';
    }
    return `<div class="anfrage-card">
      <div class="anf-head"><div class="anf-name">${a.kunden_name||'Unbekannt'}</div><div class="anf-date">${date}</div></div>
      <div class="anf-ziel">🎯 ${a.ziel||'–'}</div>
      ${a.nachricht?`<div class="msg-box">"${a.nachricht}"</div>`:''}
      ${contactHTML}
    </div>`;
  }).join('');
}

function toggleAnfragen(e) {
  if(e) e.preventDefault();
  const wp = document.getElementById('welcomePage');
  const ap = document.getElementById('anfragenPage');
  if(wp.classList.contains('hidden')) {
    wp.classList.remove('hidden');
    ap.classList.add('hidden');
  } else {
    wp.classList.add('hidden');
    ap.classList.remove('hidden');
  }
}

function logout() {
  localStorage.removeItem('vexfit_session');
  location.href = 'login.html';
}
</script>
</body>
</html>

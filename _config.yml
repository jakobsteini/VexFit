# Einstellungen fuer GitHub Pages (Jekyll).
#
# exclude nimmt Pfade von der Veroeffentlichung aus: sie bleiben im Repo,
# werden aber nicht auf vexfit.app ausgeliefert.
#
# entwuerfe/         Entwuerfe mit erfundenen Namen und E-Mail-Adressen.
# migrations/        SQL-Dateien, die den Aufbau der Datenbank beschreiben.
# supabase-setup.sql dasselbe fuer die Ersteinrichtung.
exclude:
  - entwuerfe
  - migrations
  - supabase-setup.sql

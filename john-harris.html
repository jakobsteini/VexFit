.grid{display:grid;grid-template-columns:1fr;gap:3px}
.tc{background:var(--card);position:relative;overflow:hidden}

.ci{height:150px;display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(135deg,#1a1a1a,#2a2a2a)}

<script>
const SUPABASE_URL = 'https://hbapzwxdehfgnputrfjf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_DqQ2QLBEd_mRzWIRH5npXA_e99yfAzY';
const STUDIO_SLUG = 'john-harris';

const params = new URLSearchParams(location.search);
const vorschauSchluessel = params.get('vorschau') || '';
const standortWahl = params.get('standort') || '';

let sess = null;
try { sess = JSON.parse(localStorage.getItem('vexfit_session') || 'null'); } catch(e) {}
const angemeldet = !!(sess && sess.access_token);

// Zehn Beispielprofile - NUR in der Vorschau, als "Beispielprofil" beschriftet.
// Keine echten Datensaetze: sie stehen nirgends in der Datenbank, erscheinen
// nie in der echten Suche und sind nicht anfragbar.
function beispielProfile(standortName){
  const spez = [['Muskelaufbau','Kraft'],['Abnehmen','Ausdauer'],['Functional','Mobility'],
    ['Reha','Rücken'],['Boxen','HIIT'],['Yoga','Pilates'],['Ernährung','Coaching'],
    ['Athletik','Schnelligkeit'],['Senioren','Gesundheit'],['Wettkampf','Bodybuilding']];
  let out = '';
  for(let i=0;i<10;i++){
    const nr = i+1;
    const tags = spez[i].map(s=>`<span class="ctag">${vexEsc(s)}</span>`).join('');
    out += `<div class="tc beispiel">
      <div class="ci"><div class="cav">T${nr}</div><div class="cbadge beispiel">Beispielprofil</div></div>
      <div class="cb">
        <div class="cn">Trainer/in ${nr}</div>
        <div class="cl">${vexEsc(standortName)}</div>
        <div class="ctags">${tags}</div>
      </div>
    </div>`;
  }
  return out;
}

function trainerKarten(trainer, slug){
  return trainer.map(t=>{
    const initialen = vexEsc(((t.vorname||'?')[0]+(t.nachname||'?')[0]).toUpperCase());
    const tags = (t.spezialisierungen||[]).slice(0,3).map(s=>`<span class="ctag">${vexEsc(s)}</span>`).join('');
    // Kontaktaufnahme nur fuer angemeldete Kunden: ohne Anmeldung fuehrt der
    // Knopf zur Kundenregistrierung und traegt den Standort mit (?standort=).
    const knopf = angemeldet
      ? `<a href="profil.html?id=${encodeURIComponent(t.id)}" class="btn-anmelden">Profil &amp; Anfrage</a>`
      : `<a href="registrieren.html?typ=kunde&standort=${encodeURIComponent(slug)}" class="btn-anmelden">Anmelden und anfragen</a>`;
    return `<div class="tc">
      <div class="ci"><div class="cav">${initialen}</div><div class="cbadge">Verifiziert ✓</div></div>
      <div class="cb">
        <div class="cn">${vexEsc(t.vorname)} ${vexEsc(t.nachname)}</div>
        <div class="cl">${vexEsc(t.trainingsart||'Personal Training')}</div>
        <div class="ctags">${tags}</div>
      </div>
      ${knopf}
    </div>`;
  }).join('');
}

function adresseHtml(a){
  const teile = [];
  if(a.adresse) teile.push(a.adresse.replace(/HIER EINFÜGEN/g,'<span class="platzhalter">HIER EINFÜGEN</span>'));
  const ort = [a.plz, a.stadt].filter(Boolean).join(' ').replace(/HIER EINFÜGEN/g,'<span class="platzhalter">HIER EINFÜGEN</span>');
  if(ort.trim()) teile.push(ort);
  return teile.join('<br>');
}

async function laden(){
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/studio_anzeigen', {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_slug: STUDIO_SLUG, p_vorschau: vorschauSchluessel })
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const studio = await res.json();
    if(!studio){
      document.getElementById('inhalt').innerHTML =
        '<div class="fehler">Diese Seite ist noch nicht freigeschaltet.<br>Bitte wende dich an John Harris Fitness.</div>';
      return;
    }
    document.getElementById('studioName').textContent = studio.name;
    if(studio.vorschau){
      const band = document.createElement('div');
      band.className = 'vorschau-band';
      band.textContent = '👁 Vorschau – diese Seite ist noch nicht öffentlich. Nur über den geheimen Link erreichbar.';
      document.body.prepend(band);
      document.body.classList.add('vorschau');
      // Beispielprofile nur in der Vorschau anzeigen.
    }
    const standorte = studio.standorte || [];
    // Kunden-Link merkt den Standort fuer die spaetere Anfrage (?standort=slug).
    if(standortWahl){
      const treffer = standorte.find(s => s.slug === standortWahl);
      if(treffer){
        try {
          localStorage.setItem('vexfit_studio', JSON.stringify({
            standort_id: treffer.id, slug: treffer.slug, studio: studio.name, standort: treffer.name
          }));
        } catch(e) {}
      }
    }
    let html = '';
    for(const a of standorte){
      const echte = a.trainer || [];
      let inhalt;
      if(echte.length){
        // Sobald echte Trainer da sind: ihre Karten statt der Beispielprofile.
        inhalt = `<div class="grid">${trainerKarten(echte, a.slug)}</div>`;
      } else if(studio.vorschau){
        // Vorschau ohne echte Trainer: Beispielprofile zeigen, klar beschriftet.
        inhalt = `<div class="beispiel-hinweis">Beispielprofile – so sehen die Trainerkarten dieses Standorts aus, sobald echte Trainer eingetragen sind.</div><div class="grid">${beispielProfile(a.name)}</div>`;
      } else {
        inhalt = `<div class="leer">Für diesen Standort sind bald Trainer verfügbar. <a href="registrieren.html?typ=kunde&standort=${encodeURIComponent(a.slug)}" style="color:var(--accent)">Jetzt vormerken →</a></div>`;
      }
      html += `<div class="standort" id="standort-${vexEsc(a.slug)}">
        <div class="standort-kopf">
          <div class="standort-name">${vexEsc(a.name)}</div>
          <div class="standort-adresse">${adresseHtml(a)}</div>
          <a class="standort-cta" href="registrieren.html?typ=kunde&standort=${encodeURIComponent(a.slug)}">Trainer anfragen</a>
        </div>
        ${inhalt}
      </div>`;
    }
    document.getElementById('inhalt').innerHTML = html || '<div class="leer">Noch keine Standorte hinterlegt.</div>';
    // Zum gewaehlten Standort scrollen (Kunden-QR).
    if(standortWahl){
      const el = document.getElementById('standort-' + standortWahl);
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    }
  } catch(e){
    console.error(e);
    document.getElementById('inhalt').innerHTML =
      '<div class="fehler">Die Seite konnte gerade nicht geladen werden. Bitte lade sie neu.</div>';
  }
}
laden();
</script>
</body>
</html>
